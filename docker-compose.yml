services:
  db:
    image: pgvector/pgvector:pg16
    container_name: licitai_postgres
    environment:
      POSTGRES_USER: licitai
      POSTGRES_PASSWORD: licitai_secret
      POSTGRES_DB: licitai_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - licitai_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licitai -d licitai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  licitai_pgdata:
